name: Feature request
description: Suggest something new for Anchor Launcher.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please search the [open and closed issues](https://github.com/willov/anchor-launcher/issues?q=is%3Aissue) first in case it's already been suggested, and check the [roadmap](https://github.com/willov/anchor-launcher/blob/main/ROADMAP.md) in case it's already planned.

  - type: textarea
    id: feature-description
    attributes:
      label: What would you like?
      description: A clear description of the feature.
    validations:
      required: true

  - type: textarea
    id: feature-usefulness
    attributes:
      label: Why would it be useful?
      description: What problem would it solve for you?
    validations:
      required: true

  - type: textarea
    id: feature-examples
    attributes:
      label: Examples
      description: Screenshots, sketches or links to other apps that do something similar.
    validations:
      required: false
