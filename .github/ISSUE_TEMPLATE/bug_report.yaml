name: Bug report
description: Report something in Anchor Launcher that isn't working as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Before you submit:
        1. Update to the latest version of Anchor Launcher on Google Play.
        2. Search the [open and closed issues](https://github.com/willov/anchor-launcher/issues?q=is%3Aissue) to see if it's already been reported.

  - type: textarea
    id: bug-description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: What do you need to do to make the bug happen? Mention which way the phone was turned if it matters.
      placeholder: |
        1. Open the app drawer
        2. Turn the phone to landscape
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
      description: For anything to do with rotation or moving between screens, a short screen recording helps a lot.
    validations:
      required: false

  - type: input
    id: app-version
    attributes:
      label: Anchor version
      description: Open Anchor's settings and look at the About entry.
      placeholder: 0.5.6
    validations:
      required: true

  - type: textarea
    id: device-info
    attributes:
      label: Device
      description: Your phone or tablet and Android version.
      placeholder: |
        - Device: Google Pixel 9
        - Android version: 16
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Anything else?
      description: If Anchor crashed, use Share or Copy on the crash notification and paste the report here.
    validations:
      required: false
